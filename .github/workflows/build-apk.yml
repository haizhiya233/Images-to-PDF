name: build-apk

# 只在两种情况下构建：
#   * workflow_dispatch —— 手动触发，想什么时候打包就什么时候打包
#   * push v* tag        —— 打了形如 v0.1.0 的 tag 自动出包
# 普通分支 push 不触发（没写 branches，只写了 tags）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 并发保护：同一个 ref 的两次触发会排队，不会同时跑，
# 避免两个 job 抢同一份构建产物 / 缓存目录。
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

# 这是公开仓库，构建不需要任何 secret，也不需要写权限。
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    # 首次跑要下 Android SDK/NDK、Gradle 依赖，再编译 Pillow/freetype/jpeg
    # 等原生库，45~60 分钟是正常量级；远超这个数一般是卡在交互式 licence
    # 提示或网络上了（spec 里的 android.accept_sdk_license = True 就是防这个）。
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 官方 Buildozer Docker 镜像 + 自动装 Buildozer、非交互式接受 SDK licence、
      # 跑完把 bin/ 下的 APK 路径写进 outputs.filename。
      # workdir 指向 buildozer.spec 所在目录（相对仓库根）。
      - name: Build debug APK with Buildozer
        id: buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        with:
          command: buildozer android debug
          repository_root: .
          workdir: mobile
          buildozer_version: stable

      # path 用 action 吐出来的 outputs.filename（形如 mobile/bin/xxx-debug.apk），
      # if-no-files-found: error 保证"构建成功但没产出 APK"不会被静默放过。
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Images-to-PDF-debug-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error
          retention-days: 30
