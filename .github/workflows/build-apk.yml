name: build-apk

# 只在两种情况下构建：
#   * workflow_dispatch —— 手动触发，想什么时候打包就什么时候打包
#   * push v* tag        —— 打了形如 v0.1.0 的 tag 自动出包
# 普通分支 push 不触发（没写 branches，只写了 tags）。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# 并发保护：同一个 ref 的两次触发会排队，不会同时跑，
# 避免两个 job 抢同一份构建产物 / 缓存目录。
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

# 这是公开仓库，构建不需要任何 secret，也不需要写权限。
permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android debug APK
    runs-on: ubuntu-latest

    # 直接用 Kivy 官方镜像当容器，而不是 ArtemSBulgakov/buildozer-action。
    #
    # 为什么不用那个 action：它的 Dockerfile 在官方镜像之上又跑了一遍
    #   RUN sudo add-apt-repository ppa:openjdk-r/ppa
    #   RUN sudo apt-get -y install openjdk-17-jdk
    # 而 kivy/buildozer 的底座已经换成 ubuntu:26.04（且镜像本身**已经**装了
    # openjdk-17-jdk）。于是那两行既多余又会失败：
    #   Docker build failed with exit code 1
    # 该 action 的 PR #47 正是为此提交的（删掉 PPA 那两行），但尚未合并，
    # 所以不能依赖它 —— 这里直接绕开整个 action。
    #
    # 官方镜像已预装：autoconf/automake/cmake/openjdk-17-jdk/python3-pip/
    # zip/unzip/zlib1g-dev/libtool/libffi-dev/pkg-config/git，
    # 以及 venv 里的 buildozer 本身。ENV PATH 已含 venv/bin。
    container:
      image: ghcr.io/kivy/buildozer:latest

    env:
      # 镜像里的 venv 与 buildozer 都在 /home/user；不设 HOME 的话缓存和
      # SDK 路径会落到别处。设成与镜像一致才能命中缓存。
      HOME: /home/user

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 缓存 p4a 的交叉编译产物：Python 源码包、各依赖的 build 目录，以及
      # 下载好的 Android SDK/NDK —— 这几样占了绝大部分构建时间。
      # key 故意不含 buildozer.spec 的哈希：改 spec 通常不影响已缓存的依赖
      # 产物，而重新下载要十几分钟。
      - name: Cache p4a toolchain and SDK
        uses: actions/cache@v4
        with:
          path: |
            /home/user/.buildozer
            mobile/.buildozer
          key: apk-${{ runner.os }}-p4a-v1
          restore-keys: apk-${{ runner.os }}-p4a-

      # 前置自检：把「工具链缺失」这类问题在几秒内暴露，而不是等 45 分钟后
      # 才在编译日志里看到一行误导性的报错。已实测该镜像的
      # PATH=/home/user/.venv/bin:... 且 openjdk-17-jdk 已内置。
      - name: Preflight check
        run: |
          set -x
          command -v buildozer
          buildozer --version
          command -v java && java -version
          python3 --version
          echo "HOME=$HOME  PWD=$(pwd)"

      # 首次跑要下 Android SDK/NDK、Gradle 依赖，再交叉编译 Pillow/freetype/
      # jpeg 等原生库，45~60 分钟是正常量级。远超这个数一般是卡在交互式
      # licence 提示或网络上了（spec 里 android.accept_sdk_license = True
      # 就是防前者的）。
      #
      # pipefail 是必须的：没有它，tee 会吞掉 buildozer 的退出码，step 永远
      # 显示成功，日志尾部真正的 error 行反而被当成"构建成功但没产出 APK"。
      - name: Build debug APK with Buildozer
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build-apk.log
        working-directory: mobile

      # 公开仓库的 Actions 日志页需要登录才能看，排查时拿不到。把自己的日志
      # 留成 artifact，失败时也能直接下载看，不用截图。
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: mobile/build-apk.log
          if-no-files-found: warn

      # spec 里 log_level = 2 会输出全部子进程命令，几十 MB 起，GitHub 直接
      # 截断日志页 —— 于是连失败原因都被挤出可视范围（只剩一句
      # "Process completed with exit code 1"）。raw log 要下载+解压才能看，
      # 排查成本太高。
      #
      # 所以把关键信息抽出来写进 Job Summary：它渲染在 run 页面正文里，
      # 未登录也能直接看。这是唯一能让"打开页面就知道死在哪"的地方。
      - name: Summarize failure
        if: failure()
        run: |
          LOG=mobile/build-apk.log
          {
            echo "### 构建失败诊断"
            echo
            if [ ! -f "$LOG" ]; then
              echo "没有生成日志文件（构建可能在前置自检就挂了）。"
            else
              echo "日志大小: \`$(wc -c < "$LOG")\` 字节, \`$(wc -l < "$LOG")\` 行"
              echo
              echo "#### 匹配到的错误行"
              echo '```'
              grep -nE "FAILURE:|ERROR:|error:|^Traceback|^Exception|Error:|Exception:|command failed|failed with|DeprecationWarning: .*will be removed|No matching distribution|not found|Could not|Unable to" "$LOG" \
                | tail -40 || echo "(没匹配到典型错误行，请看下方原始尾部)"
              echo '```'
              echo
              echo "#### 日志最后 50 行"
              echo '```'
              tail -50 "$LOG"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # if-no-files-found: error 保证「构建成功但没产出 APK」不会被静默放过。
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Images-to-PDF-debug-apk
          path: mobile/bin/*.apk
          if-no-files-found: error
          retention-days: 30